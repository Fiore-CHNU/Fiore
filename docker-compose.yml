services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fiore
      POSTGRES_USER: fiore
      POSTGRES_PASSWORD: fiore_dev_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiore -d fiore"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - fiore-postgres-data:/var/lib/postgresql/data

volumes:
  fiore-postgres-data:
